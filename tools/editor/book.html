<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Book</title>
  <!-- The book wears Fournée's default look; each card previews its own look. -->
  <link rel="stylesheet" href="/fournee/frosting/dist/frosting.css">
  <link rel="stylesheet" href="/fournee/fontdant/dist/fontdant.css">
  <link rel="stylesheet" href="/editor.css">
  <style>
    body { overflow: auto; height: auto; }
    .newform[hidden] { display: none; }
    .book { width: 100%; box-sizing: border-box; max-width: 72rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
    .book-head { display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .book-head h1 { margin: 0; }
    .book-head p { margin: 0.25rem 0 0; }
    .book-head .spacer { flex: 1; }
    .newform { display: grid; grid-template-columns: auto minmax(0, 18rem); gap: 0.5rem 0.75rem; align-items: center; padding: 1rem;
      margin-bottom: 1.5rem; background: var(--fr-surface); border: 1px solid var(--fr-border); border-radius: 0.75rem; max-width: 34rem; }
    .newform .row { grid-column: 1 / -1; display: flex; gap: 0.5rem; }
    .newform input, .newform select, .rename input { padding: 0.35rem 0.5rem; border: 1px solid var(--fr-border); border-radius: 0.375rem; background: var(--fr-bg); color: var(--fr-text); }
    .looks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); gap: 1.25rem; }
    .look { background: var(--fr-surface); border: 1px solid var(--fr-border); border-radius: 0.75rem; overflow: hidden; display: flex; flex-direction: column; }
    .thumb { display: block; position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-bottom: 1px solid var(--fr-border); background: var(--fr-bg); }
    .thumb iframe { position: absolute; top: 0; left: 0; width: 1100px; height: 1400px; transform-origin: 0 0; border: 0; pointer-events: none; }
    .look-body { padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    .look-body h2 { margin: 0; }
    .swatches { display: flex; gap: 0.25rem; flex-wrap: wrap; }
    .swatches span { width: 1.25rem; height: 1.25rem; border-radius: 0.25rem; border: 1px solid var(--fr-border); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-top: auto; padding-top: 0.5rem; }
    .actions .btn { text-decoration: none; display: flex; align-items: center; justify-content: center; text-align: center; white-space: nowrap; flex: 0 0 auto; min-height: 1.75rem; box-sizing: border-box; }
    .linkbtn { background: none; border: 0; padding: 0; color: var(--fr-accent-text); text-decoration: underline; text-underline-offset: 0.2em; cursor: pointer; }
    .confirm { background: var(--fr-bg); border: 1px solid var(--fr-border); border-radius: 0.5rem; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .rename { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .rename input { flex: 1; min-width: 8rem; }
    .error { color: var(--fr-bad); }
  </style>
</head>
<body>
  <main class="book">
    <div class="book-head">
      <div>
        <h1 class="fd-heading-xl">Recipe book</h1>
        <p class="fd-body-sm muted">All your looks. Each one is its own folder in <code class="fd-mono-inline">fournee-looks/looks/</code>.</p>
      </div>
      <span class="spacer"></span>
      <button id="new" class="btn fd-ui--button" type="button">New look</button>
    </div>
    <form id="newform" class="newform" hidden>
      <label class="fd-ui-sm" for="new-name">Name</label>
      <input id="new-name" class="fd-ui-input" maxlength="60" placeholder="e.g. Plum Crumb Dark" autocomplete="off">
      <label class="fd-ui-sm" for="new-from">Start from</label>
      <select id="new-from" class="fd-ui-input"></select>
      <div class="row">
        <button class="btn fd-ui--button" type="submit">Create and open</button>
        <button id="new-cancel" class="btn btn--ghost fd-ui--button" type="button">Cancel</button>
      </div>
      <p id="new-error" class="fd-body-sm error" hidden></p>
    </form>
    <div id="message" class="message fd-body-sm" hidden></div>
    <div id="looks" class="looks" aria-live="polite"><p class="fd-body-sm muted">Loading…</p></div>
  </main>
  <script src="/book.js"></script>
</body>
</html>
