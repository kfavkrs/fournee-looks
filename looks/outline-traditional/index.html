<title>Outline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bellefair&family=Belleza&family=Josefin+Sans:wght@400;600&display=swap">
<style>
  /* Layout: one centred reading column; a traditional numbered outline (I, A, 1, a, i) where every line is a toggle,
     each level's toggles set directly under its parent's number, set close in Bellefair at 1.15.
     Toggle, number and text are separated by one equal gap.
     A quiet tool bar sits at the bottom for touch screens (the same actions as the keyboard shortcuts). */
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --line: #000000;
    --faint: rgba(0, 0, 0, 0.4);
    --guide: rgba(0, 0, 0, 0.13);
    --face-title: "Belleza", "Optima", "Candara", sans-serif;
    --face-text: "Bellefair", "Cormorant Garamond", Georgia, serif;
    --face-eyebrow: "Josefin Sans", "Futura", "Century Gothic", sans-serif;
    --size-title: 2.6rem;
    --size-toggle: 1.25rem;   /* every line inside a toggle uses this one size */
    --size-eyebrow: 0.8125rem;
    --leading: 2;             /* header and tools keep double spacing */
    --leading-outline: 1.15;  /* the outline itself is set close */
    --twist: 0.45em;          /* the toggle triangle's own width */
    --gap: 1em;               /* one equal space: toggle → number → text */
    --indent: calc(var(--twist) + var(--gap));   /* children start under the parent's number */
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000000; --fg: #ffffff; --line: #ffffff; --faint: rgba(255, 255, 255, 0.45); --guide: rgba(255, 255, 255, 0.18); color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #000000; --fg: #ffffff; --line: #ffffff; --faint: rgba(255, 255, 255, 0.45); --guide: rgba(255, 255, 255, 0.18); color-scheme: dark; }

  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--face-text); font-size: var(--size-toggle); line-height: var(--leading);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 3rem 7rem;
  }
  .page { max-width: 40rem; margin: 0 auto; display: grid; gap: 1.75rem; min-width: 0; }

  .eyebrow-style {
    font-family: var(--face-eyebrow); font-size: var(--size-eyebrow); line-height: var(--leading);
    text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600;
  }
  header { display: grid; gap: 0.5rem; min-width: 0; }
  header > * { margin: 0; }
  h1 {
    font-family: var(--face-title); font-weight: 400; font-size: var(--size-title);
    letter-spacing: 0.01em; line-height: 1.15; text-wrap: balance;
  }
  .lede { max-width: 34rem; }

  [contenteditable] { outline: none; position: relative; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; caret-color: var(--fg); }
  [contenteditable].is-empty::before {
    content: attr(data-placeholder); position: absolute; left: 0; top: 0; color: var(--faint); pointer-events: none; white-space: nowrap;
  }
  .outline [contenteditable].is-empty:not(:focus)::before { content: none; }
  .outline.single [contenteditable].is-empty::before { content: attr(data-placeholder); }

  .tools button {
    font-family: var(--face-eyebrow); font-size: var(--size-eyebrow); line-height: var(--leading);
    text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600;
    background: none; color: var(--fg); border: 0; border-bottom: 1px solid var(--line); padding: 0; cursor: pointer;
  }
  .tools button:disabled { opacity: 0.35; cursor: default; }
  .tools button:focus-visible, .twist:focus-visible { outline: 1px solid var(--line); outline-offset: 4px; }
  .status { margin-left: auto; color: var(--faint); }

  .outline { display: grid; min-width: 0; line-height: var(--leading-outline); position: relative; }
  .row { position: relative; display: grid; grid-template-columns: var(--twist) auto minmax(0, 1fr); column-gap: var(--gap); align-items: baseline; min-width: 0; padding-block: 0.15em; }
  .marker { font-variant-numeric: lining-nums; white-space: nowrap; }
  .twist {
    font: inherit; width: var(--twist); height: calc(var(--leading-outline) * 1em); padding: 0; border: 0; background: none; cursor: pointer;
    justify-self: start; align-self: start; display: inline-flex; align-items: center; color: var(--fg);
  }
  .twist::before {
    content: ""; width: 0; height: 0;
    border-left: 0.42em solid currentColor; border-top: 0.27em solid transparent; border-bottom: 0.27em solid transparent;
    transition: transform 0.15s ease;
  }
  .twist.empty { color: var(--faint); }
  .group.open > .row > .twist::before { transform: rotate(90deg); }
  .body { padding-left: var(--indent); display: grid; min-width: 0; }   /* no guide line: each level's toggles sit straight under its parent's number */
  .outline > .row:not(:first-child), .outline > .group:not(:first-child) { margin-top: 0.75rem; }

  .loading { color: var(--faint); margin: 0; }

  /* drag to move: a grip in the left margin of each line (mouse and trackpad only) */
  .grip {
    position: absolute; left: -1.6em; top: 0.15em; width: 1.2em; text-align: center;
    color: var(--faint); cursor: grab; opacity: 0; user-select: none; -webkit-user-select: none; letter-spacing: -0.2em;
  }
  .row:hover > .grip, .grip.held { opacity: 1; }
  .drag-src { opacity: 0.3; }
  .drop-line { position: absolute; right: 0; height: 0; border-top: 2px solid var(--line); pointer-events: none; }
  .drop-line::before { content: ""; position: absolute; left: -4px; top: -5px; width: 6px; height: 6px; border: 2px solid var(--line); border-radius: 50%; background: var(--bg); }
  body.dragging, body.dragging * { cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }
  @media (hover: none), (pointer: coarse) { .grip { display: none; } }

  .tools {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0.5rem calc(0.5rem + env(safe-area-inset-bottom, 0px));
  }
  .tools .inner { max-width: 40rem; margin: 0 auto; display: flex; gap: 0.5rem 1.25rem; flex-wrap: wrap; align-items: baseline; }
  .tools .keys { color: var(--faint); font-family: var(--face-eyebrow); font-size: var(--size-eyebrow); line-height: 1.6; flex-basis: 100%; }

  @media (max-width: 30rem) {
    :root { --size-title: 2.05rem; }
    .tools .keys { display: none; }
  }
  @media (hover: none) { .tools .keys { display: none; } }
  @media (prefers-reduced-motion: reduce) { .twist::before { transition: none; } }
</style>

<main class="page">
  <header>
    <p class="eyebrow-style" id="f-eyebrow" contenteditable="plaintext-only" spellcheck="true" data-placeholder="Eyebrow"></p>
    <h1 id="f-title" contenteditable="plaintext-only" spellcheck="true" data-placeholder="Untitled"></h1>
    <p class="lede" id="f-lede" contenteditable="plaintext-only" spellcheck="true" data-placeholder="A line or two about this outline"></p>
  </header>

  <div class="outline" id="outline"><p class="loading">Opening your outline…</p></div>
</main>

<div class="tools" role="toolbar" aria-label="Line tools">
  <div class="inner">
    <button type="button" data-act="undo" disabled>Undo</button>
    <button type="button" data-act="redo" disabled>Redo</button>
    <button type="button" data-act="outdent">Outdent</button>
    <button type="button" data-act="indent">Indent</button>
    <button type="button" data-act="open-all">Open all</button>
    <button type="button" data-act="close-all">Close all</button>
    <button type="button" data-act="up">Move up</button>
    <button type="button" data-act="down">Move down</button>
    <span class="eyebrow-style status" id="status" aria-live="polite"></span>
    <span class="keys">⌘Z undo · ⇧⌘Z redo · Enter new line · Tab indent · Shift Tab outdent · Ctrl/⌘ Enter open or close (on a line with nothing inside, starts one) · Alt Shift ↑ ↓ move · drag ⋮⋮ to move a line (left or right changes its level)</span>
  </div>
</div>

<script>
(function () {
  var outlineEl = document.getElementById('outline');
  var statusEl = document.getElementById('status');
  var fields = { eyebrow: document.getElementById('f-eyebrow'), title: document.getElementById('f-title'), lede: document.getElementById('f-lede') };
  var state = { eyebrow: '', title: '', lede: '', items: [] };
  var items = state.items;
  var lastFocusId = null;
  var docRef = null, loaded = false, lastSavedJson = null;
  var saveTimer = null, saving = false, dirty = false, readOnly = false;
  var LOCAL_KEY = 'outline-traditional.doc';

  /* ── model: a flat list of lines, each with a depth; a line's children are the deeper lines after it ── */
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function newItem(text, depth) { return { id: uid(), text: text || '', depth: depth || 0, open: true, eyebrow: false }; }
  function idx(id) { for (var i = 0; i < items.length; i++) if (items[i].id === id) return i; return -1; }
  function hasKids(i) { return i + 1 < items.length && items[i + 1].depth > items[i].depth; }
  function subtreeEnd(i) { var d = items[i].depth, j = i + 1; while (j < items.length && items[j].depth > d) j++; return j; }
  function visibleIds() {
    var out = [], skip = Infinity;
    items.forEach(function (it) { if (it.depth > skip) return; skip = Infinity; out.push(it.id); if (!it.open) skip = it.depth; });
    return out.filter(function (id) { return true; });
  }
  function normalize(data) {
    var src = (data && Array.isArray(data.items)) ? data.items : [], out = [], prev = -1;
    src.forEach(function (r) {
      if (!r || typeof r !== 'object') return;
      var d = Math.max(0, Math.min(Number(r.depth) || 0, prev + 1));
      out.push({ id: String(r.id || uid()), text: String(r.text || ''), depth: d, open: r.open !== false, eyebrow: false });
      prev = d;
    });
    return { eyebrow: String((data && data.eyebrow) || ''), title: String((data && data.title) || ''), lede: String((data && data.lede) || ''), items: out };
  }
  function body() {
    return { eyebrow: state.eyebrow, title: state.title, lede: state.lede,
      items: items.map(function (it) { return { id: it.id, text: it.text, depth: it.depth, open: it.open, eyebrow: it.eyebrow }; }) };
  }
  function apply(data) {
    var n = normalize(data);
    if (!n.items.length) n.items.push(newItem('', 0));
    state.eyebrow = n.eyebrow; state.title = n.title; state.lede = n.lede;
    items.length = 0; n.items.forEach(function (it) { items.push(it); });
    Object.keys(fields).forEach(function (k) { fields[k].textContent = state[k]; markEmpty(fields[k]); });
  }

  /* ── numbering: I, A, 1, a, i (no full stops); deeper levels repeat 1, a, i ── */
  function roman(n) {
    var v = [1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1], r = ['M', 'CM', 'D', 'CD', 'C', 'XC', 'L', 'XL', 'X', 'IX', 'V', 'IV', 'I'], out = '';
    for (var k = 0; k < v.length; k++) while (n >= v[k]) { out += r[k]; n -= v[k]; }
    return out;
  }
  function alpha(n) { var out = ''; while (n > 0) { n--; out = String.fromCharCode(65 + (n % 26)) + out; n = Math.floor(n / 26); } return out; }
  function marker(depth, n) {
    var style = depth < 5 ? depth : 2 + ((depth - 5) % 3);
    return [roman(n), alpha(n), String(n), alpha(n).toLowerCase(), roman(n).toLowerCase()][style];
  }

  /* ── caret helpers ── */
  function caretOffset(el) {
    var sel = window.getSelection(); if (!sel.rangeCount) return 0;
    var r = sel.getRangeAt(0); if (!el.contains(r.startContainer)) return 0;
    var pre = document.createRange(); pre.selectNodeContents(el); pre.setEnd(r.startContainer, r.startOffset);
    return pre.toString().length;
  }
  function setCaret(el, offset) {
    el.focus();
    var sel = window.getSelection(), r = document.createRange(), left = offset, node = null;
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) { var t = walker.currentNode; if (left <= t.length) { node = t; break; } left -= t.length; }
    if (node) r.setStart(node, left); else { r.selectNodeContents(el); r.collapse(false); }
    r.collapse(true); sel.removeAllRanges(); sel.addRange(r);
  }
  function caretRect() {
    var sel = window.getSelection(); if (!sel.rangeCount) return null;
    var rects = sel.getRangeAt(0).getClientRects(); return rects.length ? rects[0] : null;
  }
  function onFirstLine(el) { var c = caretRect(); if (!c) return true; return c.top - el.getBoundingClientRect().top < c.height * 0.9; }
  function onLastLine(el) { var c = caretRect(); if (!c) return true; return el.getBoundingClientRect().bottom - c.bottom < c.height * 0.9; }
  function textEl(id) { return outlineEl.querySelector('.text[data-id="' + id + '"]'); }
  function markEmpty(el) { el.classList.toggle('is-empty', !el.textContent); }

  /* ── render: rebuild the nested toggles from the flat list ── */
  function render(focusId, offset) {
    outlineEl.textContent = '';
    outlineEl.classList.toggle('single', items.length === 1);
    var stack = [{ depth: -1, el: outlineEl }], skip = Infinity;
    var counts = [];
    items.forEach(function (it, i) {
      counts.length = it.depth + 1; counts[it.depth] = (counts[it.depth] || 0) + 1;
      if (it.depth > skip) return; skip = Infinity;
      while (stack.length > 1 && stack[stack.length - 1].depth >= it.depth) stack.pop();
      var parent = stack[stack.length - 1].el, kids = hasKids(i);
      var row = document.createElement('div'); row.className = 'row';
      var tw = document.createElement('button'); tw.type = 'button'; tw.className = 'twist' + (kids ? '' : ' empty'); tw.tabIndex = -1;
      if (kids) { tw.setAttribute('aria-expanded', it.open ? 'true' : 'false'); tw.setAttribute('aria-label', it.open ? 'Close' : 'Open'); }
      else tw.setAttribute('aria-label', 'Add a line inside');
      tw.dataset.id = it.id; row.appendChild(tw);
      if (!readOnly) { var gp = document.createElement('span'); gp.className = 'grip'; gp.setAttribute('aria-hidden', 'true'); gp.textContent = '⋮⋮'; gp.dataset.id = it.id; row.appendChild(gp); }
      var mk = document.createElement('span'); mk.className = 'marker'; mk.setAttribute('aria-hidden', 'true'); mk.textContent = marker(it.depth, counts[it.depth]); row.appendChild(mk);
      var t = document.createElement('div'); t.className = 'text'; t.dataset.id = it.id;
      t.setAttribute('contenteditable', readOnly ? 'false' : 'plaintext-only'); t.spellcheck = true;
      t.setAttribute('role', 'textbox'); t.dataset.placeholder = items.length === 1 ? 'Start typing…' : 'Type here';
      t.textContent = it.text; markEmpty(t); row.appendChild(t);
      if (kids) {
        var g = document.createElement('div'); g.className = 'group' + (it.open ? ' open' : '') + (it.eyebrow ? ' eyebrow' : '');
        g.appendChild(row); parent.appendChild(g);
        if (it.open) { var b = document.createElement('div'); b.className = 'body'; g.appendChild(b); stack.push({ depth: it.depth, el: b }); }
        else skip = it.depth;
      } else parent.appendChild(row);

    if (focusId) { var el = textEl(focusId); if (el) setCaret(el, offset == null ? el.textContent.length : offset); }
  }
  function rerenderKeepingFocus() {
    var a = document.activeElement;
    if (a && a.classList && a.classList.contains('text')) render(a.dataset.id, caretOffset(a)); else render();
  }

  /* ── undo / redo: whole-outline snapshots; typing is grouped into one step per pause ── */
  var undoStack = [], redoStack = [], typingBurst = false, burstTimer = null;
  function snap() {
    var a = document.activeElement, f = null, off = null;
    if (a && a.classList && a.classList.contains('text')) { f = a.dataset.id; off = caretOffset(a); }
    else if (a && a.id && a.id.indexOf('f-') === 0) { f = a.id; off = caretOffset(a); }
    return { json: JSON.stringify(body()), focus: f, offset: off };
  }
  function checkpoint() {
    if (readOnly) return;
    endBurst();
    undoStack.push(snap()); if (undoStack.length > 300) undoStack.shift();
    redoStack.length = 0; updateHistoryButtons();
  }
  var burstKind = null;
  function typingCheckpoint(e) {
    var kind = /^delete/.test(e.inputType) ? 'delete' : 'insert', sel = window.getSelection();
    var replacing = sel.rangeCount && !sel.getRangeAt(0).collapsed;
    if (!typingBurst || kind !== burstKind || replacing) { checkpoint(); typingBurst = true; burstKind = kind; if (replacing) burstKind = 'replace'; }
    clearTimeout(burstTimer); burstTimer = setTimeout(endBurst, 1000);
  }
  function endBurst() { typingBurst = false; clearTimeout(burstTimer); }
  function restore(st) {
    apply(JSON.parse(st.json));
    if (st.focus && st.focus.indexOf('f-') === 0) { render(); var f = document.getElementById(st.focus); if (f) setCaret(f, Math.min(st.offset || 0, f.textContent.length)); }
    else if (st.focus && idx(st.focus) >= 0) {
      var i = idx(st.focus);
      for (var j = i - 1, d = items[i].depth; j >= 0 && d > 0; j--) if (items[j].depth < d) { items[j].open = true; d = items[j].depth; }
      render(st.focus, Math.min(st.offset || 0, items[i].text.length));

  function undo() { if (readOnly || !undoStack.length) return; endBurst(); redoStack.push(snap()); restore(undoStack.pop()); updateHistoryButtons(); }
  function redo() { if (readOnly || !redoStack.length) return; endBurst(); undoStack.push(snap()); restore(redoStack.pop()); updateHistoryButtons(); }
  function clearHistory() { undoStack.length = 0; redoStack.length = 0; endBurst(); updateHistoryButtons(); }
  function updateHistoryButtons() {
    var u = document.querySelector('[data-act="undo"]'), rd = document.querySelector('[data-act="redo"]');
    if (u) u.disabled = !undoStack.length; if (rd) rd.disabled = !redoStack.length;
  }
  document.addEventListener('keydown', function (e) {
    if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
    var k = e.key.toLowerCase();

    else if ((k === 'z' && e.shiftKey) || (k === 'y' && !e.shiftKey)) { e.preventDefault(); redo(); }
  }, true);
  document.addEventListener('beforeinput', function (e) {
    if (e.inputType === 'historyUndo') { e.preventDefault(); undo(); }
    else if (e.inputType === 'historyRedo') { e.preventDefault(); redo(); }
  }, true);

  /* ── edits ── */
  function changed() {

    dirty = true; setStatus('Saving…');
    clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700);
  }
  function syncFromDom(id) { var el = textEl(id), i = idx(id); if (el && i >= 0) items[i].text = el.textContent; }

  function enter(id) {

    checkpoint();

    var ni = newItem(txt.slice(off), it.depth); it.text = txt.slice(0, off);

    else if (hasKids(i)) items.splice(subtreeEnd(i), 0, ni);
    else items.splice(i + 1, 0, ni);

  function indent(id) {

    render(id, off); changed();
  }
  function outdent(id) {

    checkpoint();
    var off = caretOffset(textEl(id)), p = i - 1; while (p >= 0 && items[p].depth !== d - 1) p--;

  function addInside(i) {

    if (!hasKids(i)) { addInside(i); return; }

    var el = textEl(id), off = el ? caretOffset(el) : null;

  function eyebrow(id) {
    var i = idx(id); if (i < 0) return; checkpoint(); var off = caretOffset(textEl(id));
    items[i].eyebrow = !items[i].eyebrow; render(id, off); changed();
  }
  function moveUp(id) {
    var i = idx(id), d = items[i].depth, end = subtreeEnd(i), j = i - 1;
    while (j >= 0 && items[j].depth > d) j--;

    var off = caretOffset(textEl(id)), block = items.splice(i, end - i);
    Array.prototype.splice.apply(items, [j, 0].concat(block)); render(id, off); changed();
  }
  function moveDown(id) {
    var i = idx(id), d = items[i].depth, end = subtreeEnd(i);

    var nend = subtreeEnd(end), off = caretOffset(textEl(id)), block = items.splice(i, end - i);
    Array.prototype.splice.apply(items, [nend - block.length, 0].concat(block)); render(id, off); changed();
  }
  function backspaceAtStart(id) {
    var i = idx(id), it = items[i];
    if (hasKids(i)) { if (it.depth > 0) { outdent(id); return true; } return false; }
    if (it.depth > 0 && it.text.length > 0) { outdent(id); return true; }
    var vis = visibleIds(), pos = vis.indexOf(id); if (pos <= 0) return false;
    checkpoint();
    var prevId = vis[pos - 1], prev = items[idx(prevId)], at = prev.text.length;
    prev.text += it.text; items.splice(i, 1); render(prevId, at); changed(); return true;
  }
  function pasteLines(id, text) {
    syncFromDom(id); checkpoint();
    var lines = text.replace(/\r\n?/g, '\n').split('\n');
    var i = idx(id), it = items[i], off = caretOffset(textEl(id)), rest = it.text.slice(off);
    it.text = it.text.slice(0, off) + lines[0];
    var at = hasKids(i) && !it.open ? subtreeEnd(i) : i + 1, last = it;
